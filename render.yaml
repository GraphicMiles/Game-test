services:
  - type: web
    name: sweetwater
    runtime: node
    plan: free
    region: oregon            # change to frankfurt for Europe, singapore for Asia
    branch: main
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      # The relay switches on automatically whenever the optional `ws` package
      # is present, so it is pinned off for the single-player build. Set this
      # to "0" to bring the multiplayer relay up.
      - key: NO_MULTIPLAYER
        value: "1"
